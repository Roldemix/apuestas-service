apiVersion: apps/v1
kind: Deployment
metadata:
  name: apuestas
  namespace: casino
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: apuestas
  template:
    metadata:
      labels:
        app: apuestas
    spec:
      containers:
        - name: apuestas
          image: 851725353324.dkr.ecr.us-east-1.amazonaws.com/casino/apuestas-service:latest
          ports:
            - containerPort: 8005
          env:
            - name: DB_HOST
              value: "postgres.casino.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB